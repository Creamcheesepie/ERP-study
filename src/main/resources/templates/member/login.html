<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ERP 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #f3f6fb 0%, #e9eef8 100%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: 0;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="min-vh-100 d-flex align-items-center py-5">
<main class="container">
    <section class="card login-card shadow-lg mx-auto">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <h1 class="h3 fw-bold mb-2">ERP</h1>
                <p class="text-secondary mb-0">계정으로 로그인하세요.</p>
            </div>

            <form th:action="@{/member/login}" method="post">
                <div class="mb-3">
                    <label for="loginId" class="form-label">아이디</label>
                    <input type="text" class="form-control form-control-lg" id="loginId" name="loginId"
                           autocomplete="username" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password"
                           autocomplete="current-password" required>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                    <label class="form-check-label" for="rememberMe">로그인 상태 유지</label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">로그인</button>
            </form>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYnL3nvTtaO2XSLwUuyQ4DtvwlqqOP0PZ0Qb4NQ2p6" crossorigin="anonymous"></script>
</body>
</html>
