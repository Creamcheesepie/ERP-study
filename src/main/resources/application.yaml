spring:
  application:
    name: erp

  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    hibernaet:
      ddl-auto: update
    show-sql: true

  h2:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:erp-development-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration: PT1H
